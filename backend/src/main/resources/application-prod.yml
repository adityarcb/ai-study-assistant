spring:
  datasource:
    # TiDB Cloud — connection details injected via Render environment variables
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/study_assistant_db?sslMode=VERIFY_IDENTITY&enabledTLSProtocols=TLSv1.2,TLSv1.3&createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:4H1xmQtU8dEWWtm.root}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

openrouter:
  api:
    key: ${OPENROUTER_API_KEY}

cors:
  # Render environment variable to allow Vercel domain
  allowed-origins: ${ALLOWED_ORIGIN:http://localhost:5173}
