# Server
server.port=8080

# ============================================================
# TiDB Cloud (MySQL-compatible, cloud DB) — ACTIVE
# Free tier: gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000
# Secrets are injected via env vars (see application-local.properties for local dev):
#   SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
# ============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/study_assistant_db?sslMode=VERIFY_IDENTITY&enabledTLSProtocols=TLSv1.2,TLSv1.3&createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:4H1xmQtU8dEWWtm.root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT
app.jwt.secret=${JWT_SECRET:YourSuperSecretKeyForJWTAuthenticationMustBeAtLeast32Characters}
app.jwt.expiration=86400000

# OpenRouter AI
app.openrouter.api.key=${OPENROUTER_API_KEY:YOUR_API_KEY_HERE}
app.openrouter.api.url=https://openrouter.ai/api/v1/chat/completions

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ============================================================
# LOCAL DEV ONLY (H2 file DB) — comment out TiDB block above and
