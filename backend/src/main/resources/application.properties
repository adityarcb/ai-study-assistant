# Server
server.port=8080

# H2 In-Memory Database (zero setup — works out of the box)
spring.datasource.url=jdbc:h2:file:./data/studyassistant;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console (access at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JWT
app.jwt.secret=YourSuperSecretKeyForJWTAuthenticationMustBeAtLeast32Characters
app.jwt.expiration=86400000

# OpenRouter AI
app.openrouter.api.key=${OPENROUTER_API_KEY:YOUR_API_KEY_HERE}
app.openrouter.api.url=https://openrouter.ai/api/v1/chat/completions

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ============================================================
