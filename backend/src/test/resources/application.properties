# Test configuration - uses H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT
app.jwt.secret=TestSecretKeyForJWTMustBeAtLeast32CharactersLong
app.jwt.expiration=86400000

# OpenRouter (disabled for tests)
app.openrouter.api.key=test-key
app.openrouter.api.url=https://openrouter.ai/api/v1/chat/completions
